limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
server {
  listen 80; server_name example.com www.example.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location /api/ { limit_req zone=api burst=40 nodelay; proxy_pass http://api:8000; proxy_set_header X-Real-IP $remote_addr; }
  location / { proxy_pass http://web:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
